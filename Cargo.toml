[package]
name = "musu"
version = "0.1.0"
edition = "2024"
description = "Lightweight Linux desktop & CLI integrator for portable executables"

[dependencies]
anyhow = "1.0"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4.5", features = ["derive"] }
clap_complete = "4.6.11"
dirs = "6.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"
notify-debouncer-mini = "0.7"
notify = "8.0"

[dev-dependencies]
tempfile = "3"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = "warn"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
